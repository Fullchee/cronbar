name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: swift test
      - run: scripts/build-app.sh "$GITHUB_REF_NAME"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Cronbar.zip \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Download **Cronbar.zip**, unzip it and move **Cronbar.app** to Applications. The app is not notarized: on first launch, right-click it and choose **Open**."
